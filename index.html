<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Gerador de E-mails Descartáveis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root{
      --bg:#0d0d0d;
      --neon:#00f5ff;
      --pink:#ff00c1;
      --radius:12px;
    }
    body{
      background:var(--bg);
      color:#fff;
      font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:2rem;
      min-height:100vh;
    }
    h1{
      font-size:2rem;
      margin-bottom:1rem;
      text-shadow:0 0 8px var(--neon);
    }
    .card{
      background:#111;
      border:1px solid #222;
      border-radius:var(--radius);
      padding:1.5rem;
      max-width:600px;
      width:100%;
      box-shadow:0 0 20px #0008;
    }
    .row{
      display:flex;
      gap:.5rem;
      margin-bottom:1rem;
    }
    select,button,input{
      padding:.75rem 1rem;
      border-radius:var(--radius);
      border:none;
      font-size:1rem;
    }
    select{
      flex:1;
      background:#1a1a1a;
      color:#fff;
    }
    button{
      background:linear-gradient(45deg,var(--neon),var(--pink));
      color:#000;
      font-weight:bold;
      cursor:pointer;
      transition:.2s;
    }
    button:hover{filter:brightness(1.2);}
    #email{
      width:100%;
      text-align:center;
      letter-spacing:1px;
    }
    #copyBtn{
      margin-top:.5rem;
      width:100%;
    }
    #inbox{
      margin-top:1.5rem;
      max-height:300px;
      overflow-y:auto;
    }
    .msg{
      background:#1a1a1a;
      border-left:4px solid var(--neon);
      padding:1rem;
      margin-bottom:.75rem;
      border-radius:var(--radius);
      font-size:.9rem;
    }
    .subject{font-weight:bold;margin-bottom:.25rem;}
    .from{font-size:.75rem;color:#aaa;}
    audio{display:none;}
  </style>
</head>
<body>
  <h1>Gerador de E-mails Descartáveis</h1>
  <select id="domain">
  <option value="@1secmail.com">@1secmail.com</option>
  <option value="@1secmail.org">@1secmail.org</option>
  <option value="@wwjmp.com">@wwjmp.com</option>
</select>
  
     <button id="genBtn">Gerar</button>
    </div>

    <input id="email" readonly/>
    <button id="copyBtn">Copiar e-mail</button>

    <div id="inbox"></div>
  </div>

  <audio id="ding" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mp3/button-09.mp3" type="audio/mpeg"/>
  </audio>

  <script>
  let login, domain, checkInterval;

  /* ---------- gera endereço ---------- */
  function generate() {
    fetch('https://www.1secmail.com/api/?action=genRandomMailbox&count=1')
      .then(r => r.json())
      .then(data => {
        const [full] = data;                // ex: "abc123@1secmail.com"
        [login, domain] = full.split('@');
        document.getElementById('addr').textContent = full;
        startPolling();
      });
  }

  /* ---------- atualiza mensagens ---------- */
  function startPolling() {
    if (checkInterval) clearInterval(checkInterval);
    checkInterval = setInterval(() => {
      fetch(`https://www.1secmail.com/api/?action=getMessages&login=${login}&domain=${domain}`)
        .then(r => r.json())
        .then(list => {
          const box = document.getElementById('inbox');
          box.innerHTML = '';
          list.forEach(m => {
            box.insertAdjacentHTML('beforeend',
              `<div><b>${m.from}</b> – ${m.subject} <button onclick="readMail(${m.id})">Ler</button></div>`);
          });
        });
    }, 3000);
  }

  /* ---------- lê conteúdo ---------- */
  function readMail(id) {
    fetch(`https://www.1secmail.com/api/?action=readMessage&login=${login}&domain=${domain}&id=${id}`)
      .then(r => r.json())
      .then(m => {
        alert(m.textBody || m.htmlBody);
      });
  }

  /* ---------- bind do botão ---------- */
  document.getElementById('gerarBtn').addEventListener('click', generate);
</script>

</body>
</html>
